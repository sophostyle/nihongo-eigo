<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語4択クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ========== スタート画面 ========== -->
  <section id="screen-start" class="screen">
    <div class="card start-card">
      <p class="eyebrow">VOCABULARY QUIZ</p>
      <h1 class="title">英単語4択クイズ</h1>
      <p class="lead">英単語を見て、正しい日本語の意味を4択から選ぼう。</p>

      <div id="data-status" class="data-status" aria-live="polite"></div>

      <fieldset class="count-field">
        <legend>出題数</legend>
        <div class="count-options" id="count-options" role="radiogroup" aria-label="出題数">
          <button type="button" class="count-btn" data-count="10">10問</button>
          <button type="button" class="count-btn" data-count="20">20問</button>
          <button type="button" class="count-btn" data-count="30">30問</button>
          <button type="button" class="count-btn" data-count="50">50問</button>
          <button type="button" class="count-btn" data-count="all">すべて</button>
        </div>
      </fieldset>

      <button type="button" id="start-btn" class="btn btn-primary btn-large" disabled>
        スタート
      </button>
      <p class="hint" id="start-hint">単語データを読み込み中…</p>
    </div>
  </section>

  <!-- ========== クイズ画面 ========== -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-topbar">
      <span id="progress-text" class="progress-text">第 1 問 / 20 問</span>
      <span id="score-text" class="score-text">正解 0</span>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div class="card quiz-card">
      <div class="word-area">
        <p class="word-label">この単語の意味は？</p>
        <h2 id="word-display" class="word-display">&nbsp;</h2>
        <button type="button" id="speak-btn" class="speak-btn" aria-label="発音をもう一度聞く">
          <span class="speak-icon" aria-hidden="true">🔊</span>
          <span>音声をもう一度聞く</span>
        </button>
        <p id="speech-note" class="speech-note hidden">この端末では音声読み上げが利用できません。</p>
      </div>

      <p class="choices-label">日本語の意味は？</p>
      <div id="choices" class="choices" role="group" aria-label="選択肢"></div>

      <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>

      <button type="button" id="next-btn" class="btn btn-primary btn-large hidden">次の問題</button>
    </div>
  </section>

  <!-- ========== 結果画面 ========== -->
  <section id="screen-result" class="screen hidden">
    <div class="card result-card">
      <p class="eyebrow">RESULT</p>
      <h1 class="title">クイズ終了！</h1>

      <div class="score-summary">
        <p id="score-fraction" class="score-fraction">17 / 20 正解</p>
        <p class="score-rate-label">正解率</p>
        <p id="score-rate" class="score-rate">85%</p>
      </div>

      <div id="wrong-section" class="wrong-section hidden">
        <h3 class="wrong-title">間違えた単語</h3>
        <ul id="wrong-list" class="wrong-list"></ul>
      </div>

      <div class="result-actions">
        <button type="button" id="review-btn" class="btn btn-secondary btn-large hidden">
          間違えた問題だけ復習する
        </button>
        <button type="button" id="retry-btn" class="btn btn-primary btn-large">
          もう一度挑戦
        </button>
      </div>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
